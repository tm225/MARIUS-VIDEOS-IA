name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Créer le dossier assets
        run: mkdir -p app/src/main/assets

      - name: Télécharger le modèle de détection de pose (une fois, embarqué offline dans l'APK)
        run: |
          curl -L -o app/src/main/assets/pose_landmarker_lite.task \
          https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task

      - name: Télécharger le modèle de segmentation (une fois, embarqué offline dans l'APK)
        run: |
          curl -L -o app/src/main/assets/selfie_segmenter.tflite \
          https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler l'APK debug
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-anime-apk
          path: app/build/outputs/apk/debug/app-debug.apk
